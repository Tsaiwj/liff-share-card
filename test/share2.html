<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轉分享保險名片</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; background: #f5f5f5; }
    .box { width: 82%; max-width: 320px; background: #fff; border-radius: 12px; padding: 28px; text-align: center; box-shadow: 0 4px 18px rgba(0,0,0,.12); }
    .text { font-weight: 700; color: #333; }
    .error { display: none; margin-top: 14px; padding: 12px; color: #e63946; background: #fff0f0; border-radius: 8px; font-size: 13px; text-align: left; word-break: break-all; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="box">
    <div class="text" id="status">開啟通訊錄中...</div>
    <div class="error" id="error"></div>
  </div>

  <script>
    const LIFF_ID = "2010318197-0tDLHOh7"; 

    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");

    function showError(title, detail) {
      statusEl.innerText = title;
      statusEl.style.color = "#e63946";
      errorEl.style.display = "block";
      errorEl.innerHTML = detail;
    }

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });

        if (!liff.isLoggedIn()) {
          if (!liff.isInClient()) {
            liff.login({ redirectUri: window.location.href });
          } else {
            showError("LINE 尚未登入", "請關閉後重新從 LINE 內開啟。");
          }
          return;
        }

        const flexMessage = {
          "type": "flex",
          "altText": "這是一張測試名片",
          "contents": {
            "type": "bubble",
            "hero": {
              "type": "box",
              "layout": "vertical",
              "paddingAll": "none", // 🌟 修正點：將 0px 改為 LINE 官方標準的 none
              "contents": [
                {
                  "type": "image",
                  "url": "https://tsaiwj.github.io/liff-share-card/test/%E5%A5%B31%20(1).jpg",
                  "size": "full",
                  "aspectRatio": "20:13",
                  "aspectMode": "cover"
                },
                {
                  "type": "box",
                  "layout": "vertical",
                  "position": "absolute",
                  "offsetTop": "12px",
                  "offsetLeft": "12px",
                  "backgroundColor": "#697285",
                  "cornerRadius": "20px",
                  "paddingStart": "10px",
                  "paddingEnd": "10px",
                  "paddingTop": "4px",
                  "paddingBottom": "4px",
                  "contents": [
                    {
                      "type": "text",
                      "text": "測試",
                      "color": "#ffffff",
                      "size": "xs",
                      "align": "center"
                    }
                  ]
                }
              ]
            },
            "body": {
              "type": "box",
              "layout": "vertical",
              "contents": [
                {
                  "type": "text",
                  "text": "測試",
                  "weight": "bold",
                  "size": "xl"
                },
                {
                  "type": "text",
                  "text": "測試",
                  "color": "#666666",
                  "wrap": true,
                  "margin": "md"
                }
              ]
            },
            "footer": {
              "type": "box",
              "layout": "vertical",
              "contents": [
                {
                  "type": "button",
                  "style": "link",
                  "action": {
                    "type": "uri",
                    "label": "轉分享",
                    "uri": "https://liff.line.me/" + LIFF_ID 
                  }
                }
              ]
            }
          }
        };

        if (!liff.isApiAvailable("shareTargetPicker")) {
          showError("分享功能不可用", "請確認 LINE Developers 已啟用 Share Target Picker。");
          return;
        }

        // 🌟 升級點：加入測謊機，確認訊息是真的送出，還是被系統擋下
        const shareResult = await liff.shareTargetPicker([flexMessage]);
        
        if (shareResult) {
          statusEl.innerText = "分享流程已完成！";
          statusEl.style.color = "#28a745";
          setTimeout(() => { if (liff.isInClient()) liff.closeWindow(); }, 1200);
        } else {
          showError("發送被取消", "您取消了發送，或您的 App 尚未開啟 chat_message.write 權限！");
        }

      } catch (err) {
        showError("發生錯誤", String(err && err.message ? err.message : err));
      }
    }

    main();
  </script>
</body>
</html>
</html>
