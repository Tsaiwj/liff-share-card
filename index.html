<body>
  <header class="topbar">

    <div id="empty" class="empty-state" aria-live="polite"><span class="spinner" id="spinner" aria-hidden="true"></span><span id="emptyText">正在載入 LINE 元件…</span></div>
    <div id="track" class="track" role="region" aria-label="即將分享的名片" tabindex="0" hidden></div>
    <p id="imageWarning" class="image-warning" hidden>部分圖片無法預覽，請確認圖片網址與公開權限後再分享。</p>

    </div>

      left: [['path',{d:'m15 18-6-6 6-6'}]], right: [['path',{d:'m9 18 6-6-6-6'}]],

    function recordDiagnostic(run, phase, code, attempt = 0, durationMs = 0) {

        run.events.forEach(event => lines.push('+' + (event.elapsedMs / 1000).toFixed(2) + 's ' + event.phase + ' ' + event.code +
          (event.attempt ? ' #' + event.attempt : '') + (event.durationMs ? ' (' + (event.durationMs / 1000).toFixed(2) + 's)' : '')));
      });

    function timeout(promise, ms, error, signal) {

        let settled = false;

        let remaining = ms;

        function finish(error) {
          if (settled) return;

    function loadShareCard(signal, onRecovery, diagnostic) {
      return new Promise((resolve, reject) => {
        const controller = new AbortController();
        const startedAt = performance.now();
        let settled = false;
        let attempts = 0;
        let pending = 0;
        let invalidResponse = null;
        let deadlineTimer;
        let recoveryTimer;

          if (settled) return;

          controller.abort();
          recordDiagnostic(diagnostic, '名片讀取', diagnosticCode(error), 0, performance.now() - startedAt);

          if (settled || invalidResponse || attempts >= CARD_MAX_ATTEMPTS || pending >= 2) return;

          if (attempts > 1) onRecovery(attempts, 0);

            if (settled) return;

        element.style.background = node.style === 'primary' ? color(node.color) || '#14734e' : '#f0f4f1';

          fallback.textContent = '圖片暫時無法顯示';

    }
    function renderPreview(message, generation) {

    function updateNavigation() {

  </script>
