<body>

        node.contents.forEach((child, index) => {
          const rendered = renderNode(child, generation, false);
          rendered.style.marginTop = '';
          rendered.style[node.layout === 'vertical' ? 'marginTop' : 'marginLeft'] = length(child.margin, spacing, index ? length(node.spacing, spacing, 0) : 0) + 'px';
          element.appendChild(rendered);
        });
      } else if (node.type === 'text') {
        element = document.createElement('p');
        element.className = 'flex-text';
        element.textContent = node.text;
        element.style.fontSize = length(node.size, sizes, 15) + 'px';
        element.style.fontWeight = node.weight === 'bold' ? '700' : '400';
        element.style.textAlign = ['start', 'end', 'center'].includes(node.align) ? node.align : 'start';
        element.style.color = color(node.color) || '#333333';
      } else if (node.type === 'button') {
        element = document.createElement('div');
        element.className = 'flex-button';
        element.textContent = node.action.label;
        element.title = '名片按鈕預覽';
        element.style.background = node.style === 'primary' ? color(node.color) || '#14734e' : '#f0f4f1';
        element.style.color = node.style === 'primary' ? '#ffffff' : color(node.color) || '#14734e';
      } else if (node.type === 'image' || node.type === 'icon') {
        element = document.createElement('div');
        element.className = 'image-wrap';
        const ratio = typeof node.aspectRatio === 'string' && node.aspectRatio.match(/^(\d+(?:\.\d+)?):(\d+(?:\.\d+)?)$/);
        element.style.aspectRatio = ratio && Number(ratio[1]) > 0 && Number(ratio[2]) > 0 ? ratio[1] + '/' + ratio[2] : '1/1';
        const image = document.createElement('img');
        image.alt = '名片圖片';
        image.decoding = 'async';
        image.loading = hero ? 'eager' : 'lazy';
        image.style.objectFit = node.aspectMode === 'fit' ? 'contain' : 'cover';
        image.addEventListener('error', () => {
          if (generation !== state.generation) return;
          const fallback = document.createElement('div');
          fallback.className = 'image-error';
          fallback.textContent = '圖片暫時無法顯示';
          element.replaceChildren(fallback);
          $('imageWarning').hidden = false;
        }, { once: true });
        image.src = node.url;
        element.appendChild(image);
      } else if (node.type === 'separator') {
        element = document.createElement('div');
        element.style.borderTop = '1px solid ' + (color(node.color) || '#e2e5e3');
      } else {
        element = document.createElement('div');
        element.style.minHeight = length(node.size, spacing, 8) + 'px';
      }
      if (node.margin) element.style.marginTop = length(node.margin, spacing, 0) + 'px';
      if (node.backgroundColor && color(node.backgroundColor)) element.style.backgroundColor = node.backgroundColor;
      return element;
    }
    function renderPreview(message, generation) {
      const bubbles = bubblesOf(message);
      const fragment = document.createDocumentFragment();
      bubbles.forEach((bubble, index) => {
        const article = document.createElement('article');
        article.className = 'card';
        article.setAttribute('aria-label', '第 ' + (index + 1) + ' 張名片');
        for (const section of ['header', 'hero', 'body', 'footer']) {
          if (!bubble[section]) continue;
          const element = renderNode(bubble[section], generation, section === 'hero' && index === 0);
          if (section !== 'hero') element.classList.add('card-section');
          article.appendChild(element);
        }
        fragment.appendChild(article);
      });
      $('track').replaceChildren(fragment);
      $('track').classList.toggle('single', bubbles.length === 1);
      $('track').hidden = false;
      $('track').scrollLeft = 0;
      $('summaryText').textContent = message.altText;
      $('summary').hidden = false;
      $('navigation').hidden = bubbles.length < 2;
      updateNavigation();
    }
    function updateNavigation() {
      const track = $('track');
      const cards = Array.from(track.children);
      if (!cards.length) return;
      const left = track.getBoundingClientRect().left;
      const active = cards.reduce((best, card, index) => Math.abs(card.getBoundingClientRect().left - left) < Math.abs(cards[best].getBoundingClientRect().left - left) ? index : best, 0);
      $('counter').textContent = (active + 1) + ' / ' + cards.length;
      $('previous').disabled = track.scrollLeft <= 2;
      $('next').disabled = track.scrollLeft >= track.scrollWidth - track.clientWidth - 2;
      track.dataset.active = String(active);
    }
    function moveCard(direction) {
      const track = $('track');
      const active = Number(track.dataset.active || 0);
      const card = track.children[Math.max(0, Math.min(track.children.length - 1, active + direction))];
      if (card) track.scrollTo({ left: track.scrollLeft + card.getBoundingClientRect().left - track.getBoundingClientRect().left - 6, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    }
    function updateUi() {
      const loading = state.dataLoading || state.lineLoading;
      const failure = state.dataError || state.lineError;
      $('share').disabled = !state.message || !state.lineReady || loading || state.sharing || !!failure;
      $('reload').disabled = loading || state.sharing;
      $('retry').disabled = state.sharing || loading;
      $('retry').textContent = state.dataError ? '重新讀取' : '重新連線';
      $('empty').hidden = !!state.message;
      $('spinner').hidden = !loading;
      $('emptyText').textContent = failure ? '暫時無法完成載入' : '正在讀取名片…';
      $('error').hidden = !failure;
      $('errorText').textContent = failure;
      $('shareLabel').textContent = state.sharing ? '正在開啟 LINE…' : state.success ? '再次分享' : '選擇好友並分享';
      $('status').classList.toggle('success', state.success);
      $('status').textContent = state.sharing ? '請在 LINE 選擇對象並確認傳送。' : failure ? '目前無法繼續分享，請查看上方提示。' : state.notice || (state.dataLoading ? '正在讀取名片…' : state.lineLoading ? '名片已載入，正在連接 LINE…' : '已載入 ' + (state.message ? bubblesOf(state.message).length : 0) + ' 張名片');
      $('close').hidden = !state.success || !state.lineClient || !state.lineClient.isInClient();
      if (!loading) { clearTimeout(slowTimer); slowTimer = null; }
    }
    async function start({ preserveLoaded = false } = {}) {
      if (state.sharing) return;
      const generation = ++state.generation;
      if (state.controller) state.controller.abort();
      state.controller = new AbortController();
      if (!preserveLoaded) state.message = null;
      state.dataLoading = !state.message;
      state.lineLoading = true;
      state.lineReady = false;
      state.lineClient = null;
      state.dataError = state.lineError = state.notice = '';
      state.success = false;
      $('track').hidden = $('summary').hidden = !state.message;
      $('imageWarning').hidden = true;
      $('navigation').hidden = true;
      if (state.message) renderPreview(state.message, generation);
      clearTimeout(slowTimer);
      slowTimer = setTimeout(() => {
        if (generation === state.generation && (state.dataLoading || state.lineLoading)) {
          state.notice = '連線較慢，仍在讀取中，請稍候…';
          updateUi();
        }
      }, 10000);
      updateUi();
      // Independent public-card loading and LINE initialization run concurrently.
      const signal = state.controller.signal;
      const reportRetry = message => {
        if (generation !== state.generation || signal.aborted) return;
        clearTimeout(slowTimer);
        state.notice = message;
        updateUi();
      };
      const dataTask = (state.message ? Promise.resolve(state.message) : retryLoadOnce(() => loadShareCard(signal), signal, () => reportRetry('名片連線暫時不穩，正在自動重新讀取一次…'))).then(message => {
        if (generation !== state.generation) return;
        state.message = message;
        renderPreview(message, generation);
      }).catch(error => {
        if (generation === state.generation && error.name !== 'AbortError') state.dataError = errorText(error);
      }).finally(() => {
        if (generation === state.generation) { state.dataLoading = false; state.notice = ''; updateUi(); }
      });
      const lineTask = prepareLine(signal, client => {
        if (generation !== state.generation || signal.aborted) return;
        state.lineReady = true;
        state.lineClient = client;
        state.lineLoading = false;
        state.lineError = '';
        if (!state.dataLoading) state.notice = '';
        updateUi();
      }, () => reportRetry('LINE 元件連線暫時不穩，正在自動重新連線一次…')).catch(error => {
        if (generation === state.generation && error.name !== 'AbortError') state.lineError = errorText(error);
      }).finally(() => {
        if (generation === state.generation) { state.lineLoading = false; updateUi(); }
      });
      await Promise.allSettled([dataTask, lineTask]);
    }
    async function share() {
      if ($('share').disabled || state.sharing || !state.message) return;
      state.sharing = true;
      state.success = false;
      state.notice = '';
      updateUi();
      try {
        // Keep the initialized instance even if a timed-out SDK script arrives late.
        const client = state.lineClient;
        if (!client || !client.isLoggedIn() || !client.isApiAvailable('shareTargetPicker')) {
          state.lineReady = false;
          linePromise = null;
          throw new Error('LINE 登入或分享狀態已失效，請重新連線。');
        }
        const result = await client.shareTargetPicker([state.message]);
        if (result && result.status === 'success') {
          state.success = true;
          state.notice = '分享完成，謝謝您的推薦。';
        } else if (!result) {
          state.notice = '已取消分享，名片仍保留在此頁。';
        } else throw new Error('無法確認分享結果，請先查看聊天室，避免重複傳送。');
      } catch (error) {
        state.lineError = errorText(error);
      } finally {
        state.sharing = false;
        updateUi();
      }
    }
    $('reload').addEventListener('click', () => start());
    $('retry').addEventListener('click', () => start({ preserveLoaded: true }));
    $('share').addEventListener('click', share);
    $('previous').addEventListener('click', () => moveCard(-1));
    $('next').addEventListener('click', () => moveCard(1));
    $('track').addEventListener('scroll', updateNavigation, { passive: true });
    $('track').addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') { event.preventDefault(); moveCard(event.key === 'ArrowLeft' ? -1 : 1); }
    });
    window.addEventListener('resize', updateNavigation);
    $('close').addEventListener('click', () => { if (state.lineClient && state.lineClient.isInClient()) state.lineClient.closeWindow(); });
    window.addEventListener('pagehide', () => {
      state.generation++;
      if (state.controller) state.controller.abort();
      clearTimeout(slowTimer);
    });
    window.addEventListener('pageshow', event => { if (event.persisted) start(); });
    start();
  </script>
</body>
</html>
